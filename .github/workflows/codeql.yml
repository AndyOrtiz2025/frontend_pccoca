name: CodeQL

# Análisis de seguridad del código de GitHub: busca problemas como inyecciones, datos sin
# validar o secretos expuestos. Corre en cada PR, al fusionar y una vez por semana.
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  analizar:
    name: Análisis de seguridad (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
