name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Pruebas unitarias con cobertura mínima de 80% en la lógica (vitest.config.ts).
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: Pruebas end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

      # Si algo falla, el reporte (con capturas y la grabación de cada paso) se descarga desde la corrida.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-e2e
          path: playwright-report/
          retention-days: 7

  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Busca contraseñas, tokens o claves escritas por error (reglas en .gitleaks.toml).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    name: Revisión de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Falla si el PR agrega o actualiza una librería con una vulnerabilidad alta o crítica.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
